name: Refresh contribution calendar

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-contributions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render calendar
        run: python3 .github/scripts/render_contributions.py
      - name: Commit updates
        run: |
          git add assets/github-contributions.svg assets/github-contributions-dark.svg README.md
          if git diff --staged --quiet; then
            echo "Contribution calendar is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub contribution calendar"
          git push
